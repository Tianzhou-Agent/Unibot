# Tool selection, argument extraction and result utilisation.
# Capability names are the trace target ids (list_app, open_aina, describe_aina, request_clarification,
# memory.remember, ...). Placeholders such as {{marker}} get a fresh random value on every attempt.

cases:
  - id: chat.no_tool_exact_reply
    description: A direct instruction is answered without touching any capability.
    tags: [tool_use, no_tool, smoke]
    turns:
      - user: "Reply with exactly {{marker}} and nothing else. Do not call any tool or application."
        expect:
          tools: {none: true}
          output: {equals: "{{marker}}"}
          budget: {max_iterations: 1}

  - id: chat.general_knowledge_no_tool
    description: General knowledge must not trigger a false tool call.
    tags: [tool_use, no_tool]
    turns:
      - user: "In two or three sentences, explain the difference between the HTTP 404 and 500 status codes."
        expect:
          tools: {none: true}
          output: {contains: ["404", "500"]}
          judge:
            rubric: correctness
            criteria: >-
              404 must be described as the requested resource not being found (a client-side error) and 500 as a
              server-side internal error. The answer is concise and in English.

  - id: builtin.list_app
    description: Application discovery selects list_app exactly once and reports only returned apps.
    tags: [tool_use, builtin, smoke]
    turns:
      - user: "List the apps."
        expect:
          tools: {expected: [list_app], mode: strict}
          widgets: [{kind: app_list}]
          budget: {max_iterations: 3, max_duplicate_calls: 0}
          judge:
            rubric: groundedness
            criteria: >-
              The answer lists or summarises only the applications returned by list_app and does not invent any
              application that is absent from the capability result.

  - id: builtin.describe_aina
    description: A read-only question about a named AINA uses describe_aina, not open_aina.
    tags: [tool_use, builtin]
    turns:
      - user: "What can the unibot-memory app do?"
        expect:
          tools: {expected: [describe_aina], mode: superset, forbidden: [open_aina]}
          tool_args:
            - {tool: describe_aina, args: {aina_id: "re:memory"}}
          judge:
            rubric: groundedness
            criteria: The capabilities described must come from the describe_aina result, not from guesses.

  - id: builtin.open_aina
    description: Opening an app selects open_aina with the right id and returns a navigation widget.
    tags: [tool_use, builtin]
    turns:
      - user: "Open the unibot-memory app."
        expect:
          tools: {expected: [open_aina], mode: superset}
          tool_args:
            - {tool: open_aina, args: {aina_id: unibot-memory}}
          widgets: [{kind: navigation}]
          budget: {max_duplicate_calls: 0}

  - id: builtin.clarification_form
    description: Missing information is requested through a prefilled host-rendered form.
    tags: [tool_use, builtin]
    turns:
      - user: "Use a form to collect the project name and the deadline from me, with the project name prefilled as Unibot."
        expect:
          tools: {expected: [request_clarification], mode: superset}
          widgets:
            - {kind: form, fields: {fields: [{value: Unibot}]}}
          judge:
            rubric: correctness
            criteria: >-
              The text points the user to the form and does not invent a deadline. Evaluate only the text; the form
              itself is validated separately.

  - id: builtin.multi_step_efficiency
    description: A two-part request uses each needed capability once, without redundant calls.
    tags: [tool_use, builtin, efficiency]
    turns:
      - user: "First list all apps, then tell me what unibot-scheduler can do."
        expect:
          tools: {expected: [list_app, describe_aina], mode: superset, forbidden: [open_aina]}
          budget: {max_duplicate_calls: 0, max_iterations: 4}
          judge:
            rubric: groundedness
            criteria: Both parts are answered and the scheduler description is grounded in capability results.
