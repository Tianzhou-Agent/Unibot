[project]
name = "unibot-agent-eval"
version = "0.1.0"
description = "Black-box behaviour and performance evaluation harness for the Unibot agent REST API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
]

[project.optional-dependencies]
# Ship eval spans to an OTLP collector (Jaeger, Phoenix, Tempo, Langfuse, ...).
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
unibot-eval = "unibot_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unibot_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: runs dataset cases against a real Unibot backend (needs UNIBOT_EVAL_BASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
