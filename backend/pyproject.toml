[project]
name = "tianzhou-agent-platform"
version = "0.1.0"
description = "Tianzhou Agent Platform backend"
authors = [
    { name = "SkarnerV", email = "skarner.han@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.14.1",
]

[project.scripts]
tianzhou-agent-platform = "tianzhou_agent_platform:main"

[build-system]
