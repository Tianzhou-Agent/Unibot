[project]
name = "tianzhou_agent_platform"
version = "0.1.0"
description = "天舟Agent Platform - 智能体框架与Agentic Harness OS"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tianzhou Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=1.3.1",
    "langgraph>=1.2.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.2.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0.2",
    "tzdata>=2025.2",
]

[project.scripts]
tianzhou-agent-platform = "tianzhou_agent_platform.main:run"

[project.optional-dependencies]
dev = [
    "deepeval>=4.0.0,<5.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
