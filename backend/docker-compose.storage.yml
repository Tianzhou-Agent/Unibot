name: unibot-storage

services:
  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: unibot_root
      MYSQL_DATABASE: unibot
      MYSQL_USER: unibot
      MYSQL_PASSWORD: unibot
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uunibot -punibot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nas:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /nas && tail -f /dev/null"]
    volumes:
      - ../data/nas:/nas
    healthcheck:
      test: ["CMD", "test", "-d", "/nas"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
