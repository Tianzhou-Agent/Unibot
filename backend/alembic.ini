# Developer entry point for `uv run alembic ...` (e.g. `revision --autogenerate -m "..."`).
# The database DSN comes from TZ_STORAGE_MYSQL_DSN; deployments use `tianzhou-agent-platform-migrate`.
[alembic]
script_location = %(here)s/src/tianzhou_agent_platform/store/migrations
file_template = %%(rev)s_%%(slug)s
