name: unibot-vision

services:
  vision:
    image: unibot/vision-service:local
    build:
      context: ../vision-service
      args:
        ULTRALYTICS_IMAGE: ultralytics/ultralytics:8.4.105-cpu
    environment:
      YOLO_DEVICE: auto
      YOLO_IMAGE_SIZE: "640"
      YOLO_MAX_CONCURRENCY: "1"
      YOLO_MAX_IMAGE_BYTES: "10485760"
      YOLO_MAX_IMAGE_PIXELS: "40000000"
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3))['status'] == 'ready'"
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    restart: unless-stopped
