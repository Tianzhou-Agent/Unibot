[project]
name = "unibot-aina"
version = "0.1.0"
description = "Helper for Superbot AINA Protocol 2.0 MCP servers: the call's context, a Host API client and token verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One source: src/unibot_aina links to the backend's module, which serves bundled first-party AINAs in process.
[tool.hatch.build.targets.wheel]
packages = ["src/unibot_aina"]
