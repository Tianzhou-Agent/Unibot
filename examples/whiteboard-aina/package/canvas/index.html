<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whiteboard</title>
  <link rel="stylesheet" href="./aina-ui.css">
  <link rel="stylesheet" href="./whiteboard.css">
</head>
<body>
  <div class="toolbar" role="toolbar" aria-label="Tools">
    <button type="button" data-tool="select" class="active" title="Select and move (V)">Select</button>
    <button type="button" data-tool="rectangle" title="Rectangle (R)">Rectangle</button>
    <button type="button" data-tool="ellipse" title="Ellipse (O)">Ellipse</button>
    <button type="button" data-tool="arrow" title="Arrow (A)">Arrow</button>
    <button type="button" data-tool="text" title="Text (T)">Text</button>
    <input id="text-value" aria-label="Text to place" placeholder="Text to place" value="Note">
    <span class="spacer"></span>
    <span id="status" class="aina-muted" role="status"></span>
    <button type="button" id="save" class="primary">Save</button>
  </div>
  <svg id="board" viewBox="0 0 1200 800" role="img" aria-label="Whiteboard">
    <defs>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d7d9de"/></pattern>
      <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="context-stroke" stroke-width="1.6"/>
      </marker>
    </defs>
    <rect width="1200" height="800" fill="url(#dots)"/>
    <g id="shapes"></g>
  </svg>
  <script type="module" src="./app.js"></script>
</body>
</html>
