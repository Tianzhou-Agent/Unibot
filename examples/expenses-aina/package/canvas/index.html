<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses</title>
  <link rel="stylesheet" href="./aina-ui.css">
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: baseline; gap: 12px; }
    h1 { font-size: 17px; margin: 0; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; padding: 12px; background: var(--aina-surface);
           border: 1px solid var(--aina-border); border-radius: var(--aina-radius); }
    form input[name="amount"] { width: 90px; }
    form input[name="note"] { flex: 1; min-width: 120px; }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    #status { min-height: 18px; margin-top: 8px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    tr.highlight td { background: #fff4d6; }
  </style>
</head>
<body>
  <main>
    <header><h1>Expenses</h1><span id="total" class="aina-muted"></span></header>
    <form id="add">
      <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      <select name="category">
        <option>food</option><option>transport</option><option>housing</option><option>shopping</option>
        <option>health</option><option>entertainment</option><option>other</option>
      </select>
      <input name="note" placeholder="Note (optional)">
      <button class="primary" type="submit">Add</button>
    </form>
    <table>
      <thead><tr><th>Day</th><th>Category</th><th>Note</th><th class="amount">Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="status" class="aina-muted"></p>
    <div class="actions"><button id="summarize" type="button">Ask Unibot to summarize this month</button></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
