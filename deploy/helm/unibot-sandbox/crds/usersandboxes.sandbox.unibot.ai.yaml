apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usersandboxes.sandbox.unibot.ai
spec:
  group: sandbox.unibot.ai
  scope: Namespaced
  names:
    plural: usersandboxes
    singular: usersandbox
    kind: UserSandbox
    shortNames:
      - usb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: State
          type: string
          jsonPath: .spec.desiredState
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - sandboxId
                - tenantId
                - userId
                - image
              properties:
                sandboxId:
                  type: string
                  minLength: 1
                tenantId:
                  type: string
                  minLength: 1
                userId:
                  type: string
                  minLength: 1
                workspaceId:
                  type: string
                  minLength: 1
                  maxLength: 160
                workspaceStorageKey:
                  type: string
                  minLength: 1
                  maxLength: 160
                  pattern: ^[A-Za-z0-9_-]+$
                workspacePersistentVolumeClaim:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*$
                image:
                  type: string
                  minLength: 1
                imagePullPolicy:
                  type: string
                  enum:
                    - Always
                    - IfNotPresent
                    - Never
                  default: IfNotPresent
                runtimeClassName:
                  type: string
                  default: gvisor
                storageClassName:
                  type: string
                workspaceSize:
                  type: string
                  default: 20Gi
                desiredState:
                  type: string
                  enum:
                    - Running
                    - Stopped
                  default: Running
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "1"
                    memory:
                      type: string
                      default: 2Gi
                    ephemeralStorage:
                      type: string
                      default: 2Gi
            status:
              type: object
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
                message:
                  type: string
                workspaceMountReady:
                  type: boolean
                workspaceStorageKey:
                  type: string
                workspacePersistentVolumeClaim:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
