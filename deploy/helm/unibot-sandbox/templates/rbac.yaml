apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "unibot-sandbox.operatorServiceAccount" . }}
  labels:
    {{- include "unibot-sandbox.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    {{- include "unibot-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sandbox.unibot.ai"]
    resources: ["usersandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sandbox.unibot.ai"]
    resources: ["usersandboxes/status", "usersandboxes/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    {{- include "unibot-sandbox.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "unibot-sandbox.operatorServiceAccount" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "unibot-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["sandbox.unibot.ai"]
    resources: ["usersandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "unibot-sandbox.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.backend.serviceAccountName }}
    namespace: {{ .Values.backend.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-backend
