map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
}
map $public_scheme $websocket_scheme {
    default ws;
    https wss;
}
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 12m;

    location = /healthz { return 200 "ok\n"; }
    location = / { return 302 /superbot/; }
    location = /superbot { return 308 /superbot/$is_args$args; }
    location /superbot/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /pptist { return 308 /pptist/$is_args$args; }
    location /pptist/ {
        proxy_pass http://pptist-canvas/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /drawio { return 302 /drawio/?local=1&lang=zh&stealth=1; }
    location = /drawio/api/config {
        default_type application/json;
        return 200 '{"serverUrl":"$public_scheme://$http_host/drawio","websocketUrl":"$websocket_scheme://$http_host/drawio/ws"}';
    }
    location = /drawio/ws {
        proxy_pass http://drawio:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }
    location /drawio/ {
        proxy_pass http://drawio:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_set_header Accept-Encoding '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_redirect / /drawio/;
        # The pinned MCP server injects two absolute paths into its editor/plugin.
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter '"/js/mcp-plugin.js"' '"/drawio/js/mcp-plugin.js"';
        sub_filter '"/api/config"' '"/drawio/api/config"';
    }
    location / { return 404; }
}
